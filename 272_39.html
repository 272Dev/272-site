<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>272 · servidor</title>
<link href="https://fonts.googleapis.com/css2?family=UnifrakturMaguntia&family=Share+Tech+Mono&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}

:root{
  --blood:#8b0000;
  --blood2:#c0392b;
  --blood3:#ff2020;
  --dark:#050005;
  --dark2:#0a000a;
  --text:#d4b8b8;
  --muted:rgba(212,184,184,0.4);
  --bone:#c9b89a;
}

html{scroll-behavior:smooth}

html,body{margin:0;padding:0;}
body{
  background:var(--dark);
  color:var(--text);
  font-family:'Share Tech Mono',monospace;
  cursor:none;
  overflow-x:hidden;
  min-height:100vh;
}

/* CURSOR */
#cur{position:fixed;width:12px;height:12px;border-radius:50%;background:var(--blood3);pointer-events:none;z-index:9999;mix-blend-mode:screen;box-shadow:0 0 10px var(--blood3);}
#cur-ring{position:fixed;width:28px;height:28px;border-radius:50%;border:1px solid rgba(200,0,0,0.5);pointer-events:none;z-index:9998;transition:opacity .2s;}


100%{transform:translateY(100%);}
}



to{opacity:1;transform:translateX(-50%) translateY(0)}}

/* BLOOD RAIN */
#blood-canvas{
  position:fixed;
  top:0;left:0;
  width:100%;height:100%;
  pointer-events:none;
  z-index:3;
}

/* NOISE OVERLAY */
body::before{
  content:'';position:fixed;inset:0;
  background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='0.04'/%3E%3C/svg%3E");
  pointer-events:none;z-index:1;opacity:0.35;
}

/* SCANLINES */
body::after{
  content:'';position:fixed;inset:0;
  background:repeating-linear-gradient(0deg,transparent,transparent 3px,rgba(0,0,0,0.08) 3px,rgba(0,0,0,0.08) 4px);
  pointer-events:none;z-index:2;
}

/* BG GLOW */
#bgfx{position:fixed;inset:0;z-index:0;pointer-events:none;}
.glow1{position:absolute;width:600px;height:600px;border-radius:50%;background:radial-gradient(circle,rgba(100,0,0,0.18) 0%,transparent 70%);top:-100px;left:50%;transform:translateX(-50%);}
.glow2{position:absolute;width:400px;height:400px;border-radius:50%;background:radial-gradient(circle,rgba(60,0,0,0.15) 0%,transparent 70%);bottom:10%;right:-100px;}

/* BLOOD DRIPS */
#drips{position:fixed;top:0;left:0;width:100%;height:60px;z-index:3;pointer-events:none;}
.drip{position:absolute;top:0;width:3px;background:linear-gradient(to bottom,var(--blood2),var(--blood),transparent);border-radius:0 0 50% 50%;animation:drip linear infinite;}
@keyframes drip{0%{height:0;opacity:0}10%{opacity:1}80%{opacity:0.8}100%{height:120px;opacity:0}}

/* PENTAGRAM */
#penta-wrap{position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);z-index:0;pointer-events:none;opacity:0.04;}
#penta-wrap svg{animation:spinSlow 40s linear infinite;}
@keyframes spinSlow{to{transform:rotate(360deg)}}

/* WRAP */
#wrap{position:relative;z-index:5;width:100%;margin:0 auto;padding:0;}

/* HERO */
#hero{width:100%;display:flex;flex-direction:column;align-items:center;text-align:center;padding-top:0;}

.hero-pentagram{
  width:140px;height:140px;
  margin:0 auto 0;
  position:relative;
}
.hero-pentagram svg{
  width:100%;height:100%;
  animation:spinSlow2 15s linear infinite;
  filter:drop-shadow(0 0 20px rgba(180,0,0,0.6));
}
@keyframes spinSlow2{to{transform:rotate(360deg)}}
.hero-pentagram svg.ccw{animation:spinCCW 20s linear infinite;}
@keyframes spinCCW{to{transform:rotate(-360deg)}}

.skull-icon{
  position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);
  font-size:2.5rem;
  filter:drop-shadow(0 0 8px rgba(255,0,0,0.8));
  animation:pulse-skull 2s ease-in-out infinite;
}
@keyframes pulse-skull{0%,100%{transform:translate(-50%,-50%) scale(1)}50%{transform:translate(-50%,-50%) scale(1.1)}}

.hero-name{
  font-family:'UnifrakturMaguntia',cursive;
  font-size:clamp(2.5rem,10vw,4.5rem);
  color:#cc1111;
  line-height:1;
  margin-bottom:0.5rem;
  text-shadow:0 0 20px rgba(180,0,0,0.9),0 0 50px rgba(150,0,0,0.6),0 0 80px rgba(120,0,0,0.3);
}
@keyframes flicker{
  0%,100%{opacity:1;text-shadow:0 0 20px var(--blood3),0 0 60px var(--blood),0 0 100px rgba(150,0,0,0.5)}
  92%{opacity:1}93%{opacity:0.85}94%{opacity:1}97%{opacity:0.9}98%{opacity:1}
}

.hero-sub{
  font-size:0.6rem;letter-spacing:0.3em;text-transform:uppercase;
  color:var(--blood2);margin-bottom:1.5rem;
  text-shadow:0 0 10px rgba(200,0,0,0.5);
}

/* STATS */
.stats-row{
  display:flex;gap:8px;
  background:transparent;
  border:none;
  border-radius:0;overflow:visible;
  margin-bottom:1.2rem;
  width:100%;max-width:260px;
}
.stat-cell{
  flex:1;padding:0.6rem 0.75rem;text-align:center;
  background:rgba(10,0,10,0.85);
  border:1px solid rgba(150,0,0,0.4);
  border-radius:12px;
  position:relative;
  overflow:visible;
  transition:background .2s;
}

.stat-cell:hover{background:rgba(40,0,0,0.8);}
.stat-val{
  font-family:'UnifrakturMaguntia',cursive;
  font-size:1.3rem;color:#cc1111;
  text-shadow:0 0 10px rgba(180,0,0,0.6);
  display:block;
  transition:all .4s;
}
.stat-key{font-size:0.48rem;letter-spacing:0.2em;text-transform:uppercase;color:var(--muted);margin-top:2px;}
.stat-live{display:flex;align-items:center;justify-content:center;gap:6px;font-size:0.6rem;color:rgba(212,184,184,0.3);margin-top:8px;letter-spacing:0.15em;}
.live-dot{width:6px;height:6px;border-radius:50%;background:var(--blood3);box-shadow:0 0 6px var(--blood3);animation:pulse 2s infinite;}

/* ENTER BTN */
.enter-btn{
  display:inline-flex;align-items:center;gap:10px;
  font-family:'Share Tech Mono',monospace;
  font-size:0.62rem;letter-spacing:0.15em;text-transform:uppercase;
  padding:8px 20px;
  background:transparent;
  border:1px solid var(--blood);
  color:var(--blood2);
  text-decoration:none;
  border-radius:20px;
  cursor:none;
  position:relative;overflow:visible;
  transition:color .3s,border-color .3s,box-shadow .3s;
}


.enter-btn:hover{color:#fff;border-color:var(--blood3);box-shadow:0 0 30px rgba(200,0,0,0.4);}
.enter-btn:hover::before{transform:translateX(0);}

/* DIVIDER */
.divider{
  display:flex;align-items:center;gap:1rem;
  margin:4rem 0 3rem;
}
.div-line{flex:1;height:1px;background:linear-gradient(90deg,transparent,rgba(150,0,0,0.5),transparent);}
.div-skull{font-size:1rem;color:var(--blood);filter:drop-shadow(0 0 6px var(--blood));}

/* ABOUT */
#about{min-height:100vh;margin-top:60vh;text-align:center;display:flex;flex-direction:column;justify-content:center;align-items:center;}
.about-title{
  font-family:'UnifrakturMaguntia',cursive;
  font-size:2.5rem;color:var(--bone);
  text-shadow:0 0 20px rgba(150,0,0,0.4);
  margin-bottom:2rem;
}
.about-grid{display:grid;grid-template-columns:1fr 1fr;gap:1px;background:rgba(100,0,0,0.2);}
.about-cell{
  background:rgba(8,0,8,0.9);padding:1.5rem;text-align:left;
  border:1px solid rgba(100,0,0,0.15);
}
.about-cell.wide{grid-column:span 2;}
.cell-key{font-size:0.55rem;letter-spacing:0.25em;text-transform:uppercase;color:rgba(150,0,0,0.7);margin-bottom:0.5rem;}
.cell-val{font-size:0.85rem;color:var(--text);line-height:1.7;}
.cell-val.big{font-family:'UnifrakturMaguntia',cursive;font-size:1.8rem;color:#fff;}

/* BLOOD POOL */
.blood-pool{
  width:100%;height:40px;margin:3rem 0;
  position:relative;overflow:visible;
}
.blood-pool svg{width:100%;height:100%;}

/* FOOTER */
footer{
  text-align:center;padding:3rem 0 4rem;
  font-size:0.6rem;letter-spacing:0.2em;
  color:rgba(150,0,0,0.4);
  border-top:1px solid rgba(100,0,0,0.15);
}
footer .f-penta{font-size:1rem;display:block;margin-bottom:0.5rem;animation:spinSlow2 8s linear infinite;display:inline-block;}

@keyframes lineDown{0%,100%{opacity:0.3;transform:scaleY(0.6)}50%{opacity:1;transform:scaleY(1)}}
@keyframes arrowB{0%,100%{opacity:0.3;transform:rotate(45deg) translateY(-3px)}50%{opacity:1;transform:rotate(45deg) translateY(3px)}}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:0.4}}
@keyframes fadeUp{from{opacity:0;transform:translateY(20px)}to{opacity:1;transform:translateY(0)}}

.reveal{opacity:0;transform:translateY(40px);transition:opacity 1s cubic-bezier(.16,1,.3,1),transform 1s cubic-bezier(.16,1,.3,1);}
.reveal.visible{opacity:1;transform:translateY(0);}
.reveal.visible{opacity:1;transform:none;}

@media(max-width:500px){
  .about-grid{grid-template-columns:1fr;}
  .about-cell.wide{grid-column:span 1;}
}
</style>
</head>

<script>
// cursor
const cur=document.getElementById('cur'),ring=document.getElementById('cur-ring');
let mx=0,my=0,rx=0,ry=0;
document.addEventListener('mousemove',e=>{mx=e.clientX;my=e.clientY;cur.style.left=(mx-6)+'px';cur.style.top=(my-6)+'px';});
(function animRing(){rx+=(mx-rx-14)*0.1;ry+=(my-ry-14)*0.1;ring.style.left=rx+'px';ring.style.top=ry+'px';requestAnimationFrame(animRing);})();

// blood drips
const dripsEl=document.getElementById('drips');
function makeDrip(){
  const d=document.createElement('div');
  d.className='drip';
  d.style.left=Math.random()*100+'%';
  const dur=(2+Math.random()*3).toFixed(1)+'s';
  const delay=(Math.random()*5).toFixed(1)+'s';
  d.style.animation=`drip ${dur} ${delay} linear`;
  d.style.width=(2+Math.random()*3)+'px';
  dripsEl.appendChild(d);
  setTimeout(()=>d.remove(),(parseFloat(dur)+parseFloat(delay))*1000+500);
}
setInterval(makeDrip,400);

// reveal
const obs=new IntersectionObserver(entries=>entries.forEach(e=>{if(e.isIntersecting)e.target.classList.add('visible');}),{threshold:0.1});
document.querySelectorAll('.reveal').forEach(el=>obs.observe(el));

// member counter
(function(){
  const BOT_URL="https://membros-production.up.railway.app/members";
  function animCount(el,target){
    const start=parseInt(el.textContent.replace(/\D/g,''))||0;
    const t0=performance.now();
    function upd(now){
      const p=Math.min((now-t0)/800,1);
      const e=1-Math.pow(1-p,3);
      el.textContent=Math.round(start+(target-start)*e).toLocaleString('pt-BR');
      if(p<1)requestAnimationFrame(upd);
    }
    requestAnimationFrame(upd);
  }
  function fetch272(){
    fetch(BOT_URL)
      .then(r=>r.json())
      .then(d=>{
        animCount(document.getElementById('member-count'),d.count);
        animCount(document.getElementById('online-count'),d.online||0);
      })
      .catch(()=>{
        document.getElementById('member-count').textContent='???';
        document.getElementById('online-count').textContent='???';
      });
  }
  fetch272();
  setInterval(fetch272,60000);
})();

// BLOOD DRIPS CANVAS
(function(){
  const canvas = document.getElementById('blood-canvas');
  const ctx = canvas.getContext('2d');
  
  function resize(){ canvas.width=window.innerWidth; canvas.height=window.innerHeight; }
  resize();
  window.addEventListener('resize', resize);

  const drips = [];
  const MAX = 40;

  function Drip(){
    this.x = Math.random() * window.innerWidth;
    this.y = -20;
    this.w = 1.5 + Math.random() * 2.5;
    this.speed = 0.4 + Math.random() * 1.2;
    this.len = 20 + Math.random() * 80;
    this.alpha = 0.5 + Math.random() * 0.5;
    this.tail = [];
    this.maxTail = Math.floor(10 + Math.random() * 20);
    this.color = `rgba(${120+Math.floor(Math.random()*40)},0,0,`;
  }

  Drip.prototype.update = function(){
    this.tail.unshift({x:this.x, y:this.y});
    if(this.tail.length > this.maxTail) this.tail.pop();
    this.y += this.speed;
  };

  Drip.prototype.draw = function(){
    for(let i=0;i<this.tail.length;i++){
      const t = this.tail[i];
      const a = this.alpha * (1 - i/this.tail.length);
      ctx.beginPath();
      ctx.arc(t.x, t.y, this.w * (1 - i/this.tail.length * 0.5), 0, Math.PI*2);
      ctx.fillStyle = this.color + a + ')';
      ctx.fill();
    }
    // drip head
    ctx.beginPath();
    ctx.arc(this.x, this.y, this.w, 0, Math.PI*2);
    ctx.fillStyle = this.color + this.alpha + ')';
    ctx.fill();
  };

  // spawn drips
  function spawn(){
    if(drips.length < MAX){
      drips.push(new Drip());
    }
    setTimeout(spawn, 80 + Math.random()*200);
  }
  spawn();

  function loop(){
    ctx.clearRect(0,0,canvas.width,canvas.height);
    for(let i=drips.length-1;i>=0;i--){
      drips[i].update();
      drips[i].draw();
      if(drips[i].y > canvas.height + 50) drips.splice(i,1);
    }
    requestAnimationFrame(loop);
  }
  loop();
})();

</script>
