<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title></title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=UnifrakturMaguntia&display=swap');
  @import url('https://fonts.googleapis.com/css2?family=Share+Tech+Mono&display=swap');
  *{margin:0;padding:0;box-sizing:border-box}
  :root{--blood:#8b0000;--ember:#cc0000;--void:#020000;--flesh:#0e0303}
  html{scroll-behavior:smooth;scrollbar-width:thin;scrollbar-color:var(--blood) var(--void)}
  body{min-height:200vh;background:var(--void);cursor:none;overflow-x:hidden}
  body::-webkit-scrollbar{width:5px}
  body::-webkit-scrollbar-track{background:var(--void)}
  body::-webkit-scrollbar-thumb{background:var(--blood);border-radius:3px}

  /* ══ HEARTBEAT BG ══ */
  .bg-heart{position:fixed;inset:0;z-index:1;pointer-events:none;background:radial-gradient(ellipse 90% 70% at 50% 50%,var(--flesh),var(--void) 65%)}
  .bg-pulse{
    position:fixed;inset:0;z-index:2;pointer-events:none;
    background:radial-gradient(circle at 50% 50%,rgba(139,0,0,.07) 0%,rgba(80,0,0,.02) 30%,transparent 55%);
    animation:hbP 1.8s ease-in-out infinite;will-change:transform,opacity;
  }
  .bg-pulse2{
    position:fixed;inset:0;z-index:1;pointer-events:none;
    background:radial-gradient(circle at 50% 50%,rgba(139,0,0,.04) 0%,transparent 45%);
    animation:hbP2 1.8s ease-in-out infinite;
  }
  @keyframes hbP{0%,30%,100%{transform:scale(1);opacity:.35}8%{transform:scale(1.05);opacity:.9}14%{transform:scale(1.01);opacity:.45}22%{transform:scale(1.07);opacity:1}}
  @keyframes hbP2{0%,30%,100%{transform:scale(1);opacity:.25}8%{transform:scale(1.1);opacity:.6}14%{transform:scale(1.03);opacity:.3}22%{transform:scale(1.13);opacity:.7}}

  .bg-veins{position:fixed;inset:0;z-index:3;opacity:.03;mix-blend-mode:screen;pointer-events:none;animation:vB 1.8s ease-in-out infinite}
  @keyframes vB{0%,30%,100%{opacity:.02}8%{opacity:.05}22%{opacity:.06}}

  .bg-fog{position:fixed;inset:0;z-index:4;pointer-events:none;overflow:hidden}
  .bg-fog-layer{position:absolute;width:250%;height:250%;top:-75%;left:-75%;background:radial-gradient(ellipse at 25% 75%,rgba(139,0,0,.035) 0%,transparent 45%),radial-gradient(ellipse at 75% 25%,rgba(80,0,0,.025) 0%,transparent 40%);animation:fg 35s linear infinite;will-change:transform}
  .bg-fog-layer:nth-child(2){animation:fg 45s linear infinite reverse;opacity:.5}
  @keyframes fg{0%{transform:translate(0,0) rotate(0deg)}100%{transform:translate(-6%,3%) rotate(4deg)}}

  .bg-drips{position:fixed;top:0;left:0;right:0;height:100%;z-index:5;pointer-events:none;overflow:hidden}
  .drip{position:absolute;top:-10px;width:2px;background:linear-gradient(to bottom,var(--blood),transparent);border-radius:0 0 50% 50%;opacity:0;animation:dr var(--dur) var(--del) ease-in infinite}
  .drip:nth-child(1){left:8%;--dur:14s;--del:0s;--len:180px}
  .drip:nth-child(2){left:22%;--dur:18s;--del:4s;--len:250px;width:1px}
  .drip:nth-child(3){left:45%;--dur:12s;--del:8s;--len:120px}
  .drip:nth-child(4){left:67%;--dur:20s;--del:2s;--len:300px;width:3px}
  .drip:nth-child(5){left:83%;--dur:16s;--del:10s;--len:200px;width:1px}
  .drip:nth-child(6){left:35%;--dur:22s;--del:6s;--len:160px}
  @keyframes dr{0%{height:0;opacity:0;top:-10px}10%{opacity:.1}60%{opacity:.05}100%{height:var(--len);opacity:0;top:0}}

  .border-glow{position:fixed;inset:0;z-index:48;pointer-events:none;border:1px solid rgba(139,0,0,.05);animation:bG 1.8s ease-in-out infinite}
  @keyframes bG{0%,30%,100%{box-shadow:inset 0 0 60px rgba(139,0,0,.025);border-color:rgba(139,0,0,.04)}8%{box-shadow:inset 0 0 90px rgba(139,0,0,.06);border-color:rgba(139,0,0,.1)}22%{box-shadow:inset 0 0 110px rgba(139,0,0,.07);border-color:rgba(139,0,0,.12)}}

  .corner{position:fixed;z-index:52;pointer-events:none;width:55px;height:55px;animation:cP 1.8s ease-in-out infinite}
  .corner svg{width:100%;height:100%}
  .corner-tl{top:10px;left:10px}.corner-tr{top:10px;right:10px;transform:scaleX(-1)}.corner-bl{bottom:10px;left:10px;transform:scaleY(-1)}.corner-br{bottom:10px;right:10px;transform:scale(-1)}
  @keyframes cP{0%,30%,100%{opacity:.07}8%{opacity:.18}22%{opacity:.2}}

  .bg-scan{position:fixed;inset:0;z-index:50;pointer-events:none;background:repeating-linear-gradient(0deg,transparent,transparent 2px,rgba(0,0,0,.035) 2px,rgba(0,0,0,.035) 4px);opacity:.3}
  .bg-vig{position:fixed;inset:0;z-index:49;pointer-events:none;background:radial-gradient(ellipse 55% 55% at 50% 50%,transparent 15%,rgba(0,0,0,.78) 100%);animation:vgB 1.8s ease-in-out infinite}
  @keyframes vgB{0%,30%,100%{opacity:1}8%{opacity:.92}22%{opacity:.9}}
  .bg-grain{position:fixed;inset:-50%;z-index:51;pointer-events:none;opacity:.02;mix-blend-mode:overlay;background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='1'/%3E%3C/svg%3E");background-size:128px 128px;animation:gr .5s steps(4) infinite}
  @keyframes gr{0%{transform:translate(0,0)}25%{transform:translate(-5%,5%)}50%{transform:translate(3%,-3%)}75%{transform:translate(-2%,2%)}100%{transform:translate(0,0)}}

  /* ══ CURSOR CANVAS + PARTICLES ══ */
  #particles{position:fixed;inset:0;z-index:53;pointer-events:none}

  /* ══ HERO ══ */
  .hero{position:relative;z-index:10;width:100%;height:100vh;display:flex;align-items:center;justify-content:center;flex-direction:column}
  .pentagram-bg{
    position:absolute;width:min(700px,95vw);height:min(700px,95vw);object-fit:contain;z-index:5;
    animation:pS 50s linear infinite,pH 1.8s ease-in-out infinite;will-change:transform;
    filter:drop-shadow(0 0 50px rgba(139,0,0,.4)) drop-shadow(0 0 100px rgba(80,0,0,.2));
  }
  @keyframes pS{0%{transform:rotate(0deg)}100%{transform:rotate(360deg)}}
  @keyframes pH{0%,30%,100%{opacity:.12}8%{opacity:.2}14%{opacity:.13}22%{opacity:.24}}

  .server-name{
    font-family:'UnifrakturMaguntia',serif;font-size:clamp(2rem,6vw,4rem);
    color:var(--blood);text-align:center;position:relative;letter-spacing:.1em;
    user-select:none;z-index:6;
    animation:nH 1.8s ease-in-out infinite,gl 10s ease-in-out infinite;
  }
  @keyframes nH{
    0%,30%,100%{text-shadow:0 0 15px rgba(139,0,0,.5),0 0 40px rgba(139,0,0,.2),0 0 80px rgba(139,0,0,.1);filter:brightness(1)}
    8%{text-shadow:0 0 25px rgba(139,0,0,.9),0 0 60px rgba(139,0,0,.5),0 0 120px rgba(139,0,0,.3);filter:brightness(1.15)}
    14%{text-shadow:0 0 18px rgba(139,0,0,.55),0 0 45px rgba(139,0,0,.25);filter:brightness(1.02)}
    22%{text-shadow:0 0 30px rgba(139,0,0,1),0 0 70px rgba(139,0,0,.6),0 0 140px rgba(139,0,0,.35);filter:brightness(1.2)}
  }
  @keyframes gl{0%,93%,97%,100%{transform:translate(0,0) skewX(0deg)}94%{transform:translate(-3px,1px) skewX(-0.5deg)}95%{transform:translate(3px,-1px) skewX(0.4deg)}96%{transform:translate(0,0) skewX(0deg)}}
  .server-name::before,.server-name::after{content:attr(data-text);position:absolute;top:0;left:0;right:0;pointer-events:none}
  .server-name::before{color:rgba(255,0,0,.08);animation:cR 5s ease-in-out infinite;clip-path:inset(0 0 50% 0)}
  .server-name::after{color:rgba(200,0,0,.06);animation:cL 5s ease-in-out infinite;clip-path:inset(50% 0 0 0)}
  @keyframes cR{0%,100%{transform:translate(0,0)}50%{transform:translate(2px,-1px)}}
  @keyframes cL{0%,100%{transform:translate(0,0)}50%{transform:translate(-2px,1px)}}

  .scroll-hint{position:absolute;bottom:30px;z-index:10;display:flex;flex-direction:column;align-items:center;gap:8px;animation:hF 3s ease-in-out infinite}
  .scroll-hint span{font-family:'Share Tech Mono',monospace;font-size:.6rem;color:var(--blood);opacity:.35;letter-spacing:.3em;text-transform:uppercase}
  .scroll-arrow{width:16px;height:16px;border-right:1px solid var(--blood);border-bottom:1px solid var(--blood);transform:rotate(45deg);opacity:.25}
  @keyframes hF{0%,100%{opacity:.3;transform:translateY(0)}50%{opacity:.7;transform:translateY(5px)}}

  /* ══ HIERARCHY ══ */
  .hierarchy{position:relative;z-index:10;display:flex;flex-direction:column;align-items:center;padding:80px 20px 120px}
  .section-title{font-family:'Share Tech Mono',monospace;font-size:clamp(.85rem,2.2vw,1.2rem);color:var(--blood);text-align:center;letter-spacing:.25em;text-transform:uppercase;margin-bottom:50px;text-shadow:0 0 20px rgba(139,0,0,.25)}
  .section-title::after{content:'';display:block;width:100px;height:1px;background:linear-gradient(90deg,transparent,rgba(139,0,0,.4),transparent);margin:12px auto 0}
  .chain{display:flex;flex-direction:column;align-items:center;width:100%}
  .rank-card{
    position:relative;width:min(440px,88vw);background:linear-gradient(135deg,rgba(18,5,5,.7),rgba(5,0,0,.8));
    border:1px solid rgba(139,0,0,.08);border-radius:2px;padding:24px 28px;
    backdrop-filter:blur(4px);transition:border-color .5s,box-shadow .5s;overflow:hidden;
    animation:cdB 1.8s ease-in-out infinite;
  }
  @keyframes cdB{0%,30%,100%{box-shadow:0 0 20px rgba(139,0,0,.02);border-color:rgba(139,0,0,.08)}8%{box-shadow:0 0 35px rgba(139,0,0,.06);border-color:rgba(139,0,0,.14)}22%{box-shadow:0 0 40px rgba(139,0,0,.07);border-color:rgba(139,0,0,.16)}}
  .rank-card::before{content:'';position:absolute;inset:-1px;border-radius:2px;background:linear-gradient(45deg,transparent 30%,rgba(139,0,0,.15) 50%,transparent 70%);background-size:300% 300%;animation:sh 6s ease-in-out infinite;z-index:-1;mask:linear-gradient(#fff 0 0) content-box,linear-gradient(#fff 0 0);-webkit-mask:linear-gradient(#fff 0 0) content-box,linear-gradient(#fff 0 0);mask-composite:exclude;-webkit-mask-composite:xor;padding:1px}
  @keyframes sh{0%{background-position:0% 50%}50%{background-position:100% 50%}100%{background-position:0% 50%}}
  .rank-card::after{content:'';position:absolute;top:0;left:0;right:0;height:1px;background:linear-gradient(90deg,transparent,rgba(139,0,0,.2),transparent)}
  .rank-card:hover{border-color:rgba(139,0,0,.25);box-shadow:0 0 60px rgba(139,0,0,.08),inset 0 0 40px rgba(139,0,0,.02)}
  .cs{position:absolute;width:8px;height:8px;pointer-events:none}
  .cs::before{content:'';position:absolute;width:1px;height:8px;background:linear-gradient(to bottom,rgba(139,0,0,.3),transparent)}
  .cs::after{content:'';position:absolute;width:8px;height:1px;background:linear-gradient(to right,rgba(139,0,0,.3),transparent)}
  .cs-tl{top:0;left:0}.cs-tr{top:0;right:0;transform:scaleX(-1)}.cs-bl{bottom:0;left:0;transform:scaleY(-1)}.cs-br{bottom:0;right:0;transform:scale(-1)}
  .rank-label{font-family:'Share Tech Mono',monospace;font-size:clamp(.5rem,1.1vw,.6rem);color:var(--blood);opacity:.35;letter-spacing:.5em;text-transform:uppercase;margin-bottom:10px}
  .rank-name{font-family:'Share Tech Mono',monospace;font-size:clamp(1rem,3vw,1.4rem);color:var(--ember);margin-bottom:5px;text-shadow:0 0 10px rgba(139,0,0,.25);letter-spacing:.05em}
  .rank-line{width:45px;height:1px;background:linear-gradient(90deg,rgba(139,0,0,.35),transparent);margin:8px 0 10px}
  .rank-roles{font-family:'Share Tech Mono',monospace;font-size:clamp(.55rem,1.3vw,.68rem);color:rgba(139,0,0,.35);letter-spacing:.06em;line-height:1.7}
  .rank-symbol{position:absolute;top:16px;right:20px;font-size:1.1rem;opacity:.1}
  .connector{width:1px;height:35px;background:linear-gradient(to bottom,rgba(139,0,0,.15),rgba(139,0,0,.03))}
</style>
</head>
<body>
  <div class="bg-heart"></div><div class="bg-pulse2"></div><div class="bg-pulse"></div>
  <svg class="bg-veins" viewBox="0 0 1000 1000" preserveAspectRatio="none"><filter id="t"><feTurbulence type="fractalNoise" baseFrequency="0.012" numOctaves="3" seed="5"/><feColorMatrix type="saturate" values="0"/></filter><rect width="100%" height="100%" filter="url(#t)" fill="darkred"/></svg>
  <div class="bg-fog"><div class="bg-fog-layer"></div><div class="bg-fog-layer"></div></div>
  <div class="bg-drips"><div class="drip"></div><div class="drip"></div><div class="drip"></div><div class="drip"></div><div class="drip"></div><div class="drip"></div></div>
  <canvas id="particles"></canvas>
  <div class="border-glow"></div>
  <div class="corner corner-tl"><svg viewBox="0 0 60 60"><path d="M0,0 L25,0 L25,2 L2,2 L2,25 L0,25 Z" fill="#8b0000"/><path d="M0,0 L15,15" stroke="#8b0000" stroke-width=".5" opacity=".5"/><circle cx="5" cy="5" r="1.5" fill="#8b0000" opacity=".4"/></svg></div>

  <div class="corner corner-bl"><svg viewBox="0 0 60 60"><path d="M0,0 L25,0 L25,2 L2,2 L2,25 L0,25 Z" fill="#8b0000"/><path d="M0,0 L15,15" stroke="#8b0000" stroke-width=".5" opacity=".5"/><circle cx="5" cy="5" r="1.5" fill="#8b0000" opacity=".4"/></svg></div>

<script>
// ── Tab title typing animation ──
(function(){
  const frames=['2','27','272','272','272','272','272','272','27','2','','',''];
  let i=0;
  setInterval(()=>{document.title=frames[i];i=(i+1)%frames.length},300);
})();

// ── Canvas: particles + cursor ball with trail ──
const c=document.getElementById('particles'),x=c.getContext('2d');
let W,H;
function resize(){W=c.width=innerWidth;H=c.height=innerHeight}
resize();addEventListener('resize',resize);

// Mouse state
let mx=-100,my=-100;
const trail=[];
const TRAIL_LEN=18;

document.addEventListener('mousemove',e=>{
  mx=e.clientX;my=e.clientY;
  trail.push({x:mx,y:my,t:performance.now()});
  if(trail.length>TRAIL_LEN)trail.shift();
});
document.addEventListener('mouseleave',()=>{mx=-200;my=-200});

// Particles
const P=[];
const COUNT=120;
for(let i=0;i<COUNT;i++){
  P.push({
    x:Math.random()*innerWidth,
    y:Math.random()*innerHeight,
    r:Math.random()*1.8+.3,
    vx:(Math.random()-.5)*.3,
    vy:-Math.random()*.4-.1,
    a:Math.random()*.5+.1,
    pulse:Math.random()*Math.PI*2,
    ps:Math.random()*.02+.01
  });
}

function tick(t){
  x.clearRect(0,0,W,H);

  // Heartbeat intensity
  const beat=(t/1000)%1.8/1.8;
  let hb=0;
  if(beat<.045)hb=beat/.045;
  else if(beat<.08)hb=1-(beat-.045)/.035;
  else if(beat<.11)hb=0;
  else if(beat<.155)hb=(beat-.11)/.045;
  else if(beat<.2)hb=1-(beat-.155)/.045;
  hb=Math.max(0,Math.min(1,hb));

  // Draw particles
  for(let i=0;i<COUNT;i++){
    const p=P[i];
    p.x+=p.vx;p.y+=p.vy;p.pulse+=p.ps;
    if(p.y<-10){p.y=H+10;p.x=Math.random()*W}
    if(p.x<-10)p.x=W+10;
    if(p.x>W+10)p.x=-10;

    const fl=Math.sin(p.pulse)*.3+.7;
    const al=p.a*fl*(1+hb*.6);
    const rd=p.r*(1+hb*.3);

    const g=x.createRadialGradient(p.x,p.y,0,p.x,p.y,rd*4);
    g.addColorStop(0,`rgba(139,0,0,${al*.6})`);
    g.addColorStop(.5,`rgba(139,0,0,${al*.15})`);
    g.addColorStop(1,'transparent');
    x.fillStyle=g;
    x.beginPath();x.arc(p.x,p.y,rd*4,0,Math.PI*2);x.fill();

    x.fillStyle=`rgba(200,20,20,${al})`;
    x.beginPath();x.arc(p.x,p.y,rd,0,Math.PI*2);x.fill();
  }

  // Draw cursor trail
  const now=performance.now();
  if(mx>-100){
    for(let i=0;i<trail.length;i++){
      const pt=trail[i];
      const age=(now-pt.t)/300;
      if(age>1)continue;
      const prog=i/trail.length;
      const alpha=(1-age)*.5*prog;
      const radius=3*prog+1;

      const tg=x.createRadialGradient(pt.x,pt.y,0,pt.x,pt.y,radius*3);
      tg.addColorStop(0,`rgba(200,0,0,${alpha*.7})`);
      tg.addColorStop(.6,`rgba(139,0,0,${alpha*.2})`);
      tg.addColorStop(1,'transparent');
      x.fillStyle=tg;
      x.beginPath();x.arc(pt.x,pt.y,radius*3,0,Math.PI*2);x.fill();

      x.fillStyle=`rgba(220,30,30,${alpha})`;
      x.beginPath();x.arc(pt.x,pt.y,radius,0,Math.PI*2);x.fill();
    }

    // Main cursor ball
    const cursorGlow=x.createRadialGradient(mx,my,0,mx,my,22);
    cursorGlow.addColorStop(0,`rgba(200,0,0,${.3+hb*.2})`);
    cursorGlow.addColorStop(.4,`rgba(139,0,0,${.1+hb*.1})`);
    cursorGlow.addColorStop(1,'transparent');
    x.fillStyle=cursorGlow;
    x.beginPath();x.arc(mx,my,22,0,Math.PI*2);x.fill();

    // Core ball
    const coreG=x.createRadialGradient(mx,my,0,mx,my,5);
    coreG.addColorStop(0,`rgba(255,40,40,${.9+hb*.1})`);
    coreG.addColorStop(.5,`rgba(200,10,10,${.7+hb*.1})`);
    coreG.addColorStop(1,`rgba(139,0,0,.3)`);
    x.fillStyle=coreG;
    x.beginPath();x.arc(mx,my,5,0,Math.PI*2);x.fill();
  }

  requestAnimationFrame(tick);
}
requestAnimationFrame(tick);
</script>
